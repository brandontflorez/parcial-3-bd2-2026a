<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Editar Inmueble</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

{% include "navbar.html" %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>✏️ Editar Inmueble</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Tipo</label>

                    <select name="id_tipo" class="form-control">

                        <option value="1" {% if inmueble.id_tipo == 1 %}selected{% endif %}>
                            Casa
                        </option>

                        <option value="2" {% if inmueble.id_tipo == 2 %}selected{% endif %}>
                            Apartamento
                        </option>

                        <option value="3" {% if inmueble.id_tipo == 3 %}selected{% endif %}>
                            Local
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label>Dirección</label>

                    <input
                        type="text"
                        name="direccion"
                        class="form-control"
                        value="{{ inmueble.direccion }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Área</label>

                    <input
                        type="number"
                        step="0.01"
                        name="area"
                        class="form-control"
                        value="{{ inmueble.area }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Habitaciones</label>

                    <input
                        type="number"
                        name="habitaciones"
                        class="form-control"
                        value="{{ inmueble.habitaciones }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Canon</label>

                    <input
                        type="number"
                        name="canon"
                        class="form-control"
                        value="{{ inmueble.canon_sugerido }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Estado</label>

                    <select
                        name="estado"
                        class="form-control">

                        <option value="Disponible"
                            {% if inmueble.estado == 'Disponible' %}
                            selected
                            {% endif %}>

                            Disponible

                        </option>

                        <option value="Arrendado"
                            {% if inmueble.estado == 'Arrendado' %}
                            selected
                            {% endif %}>

                            Arrendado

                        </option>

                    </select>

                </div>

                <button class="btn btn-success">
                    Guardar Cambios
                </button>

                <a href="/inmuebles"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
