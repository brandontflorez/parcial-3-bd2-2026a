<!DOCTYPE html>

<html lang="es">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Sistema Inmobiliario</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#0d6efd,#198754);
        font-family:'Segoe UI',sans-serif;
    }

    .login-card{
        width:100%;
        max-width:460px;
        border:none;
        border-radius:25px;
        overflow:hidden;
    }

    .card-header-custom{
        background:white;
        text-align:center;
        padding:30px;
    }

    .logo{
        font-size:4rem;
    }

    .titulo{
        color:#0d6efd;
        font-weight:bold;
    }

    .card-body{
        padding:35px;
    }

    .form-control{
        border-radius:12px;
        padding:12px;
    }

    .btn-login{
        border-radius:12px;
        padding:12px;
        font-size:1.1rem;
        font-weight:bold;
    }

    .footer{
        text-align:center;
        margin-top:15px;
        color:#6c757d;
        font-size:.9rem;
    }

</style>
```

</head>

<body>

<div class="card login-card shadow-lg">

```
<div class="card-header-custom">

    <div class="logo">
        🏠
    </div>

    <h2 class="titulo">
        Sistema de Gestión Inmobiliaria
    </h2>

    <p class="text-muted">
        Inicia sesión para continuar
    </p>

</div>

<div class="card-body">

    <form method="POST">

        {% if error %}
        <div class="alert alert-danger mb-3">
            {{ error }}
        </div>
        {% endif %}

        <div class="mb-3">

            <label class="form-label">
                Usuario
            </label>

            <input
                type="text"
                name="usuario"
                class="form-control"
                placeholder="Ingrese su usuario"
                required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Contraseña
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Ingrese su contraseña"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary btn-login w-100">

            🔐 Ingresar

        </button>

    </form>

    <div class="footer">

        Flask + MySQL | Proyecto Inmobiliaria

    </div>

</div>

</div>

</body>
</html>
