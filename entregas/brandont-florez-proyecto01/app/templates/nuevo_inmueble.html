<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Inmueble</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card-form{
            border:none;
            border-radius:18px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .header{
            background:linear-gradient(135deg,#0d6efd,#198754);
            color:white;
            padding:20px;
            border-radius:18px 18px 0 0;
        }

        .form-label{
            font-weight:600;
        }

        .btn-action{
            width:100%;
            padding:10px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card card-form">

        <div class="header text-center">
            <h2>🏠 Registrar Nuevo Inmueble</h2>
            <p class="mb-0">Completa la información del inmueble</p>
        </div>

        <div class="card-body p-4">

            <form method="POST">

                <div class="row">

                    <!-- PROPIETARIO -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Propietario</label>
                        <select name="id_propietario" class="form-select" required>
                            <option value="">Seleccione propietario</option>

                            {% for p in propietarios %}
                                <option value="{{ p.id_propietario }}">
                                    {{ p.nombres }} {{ p.apellidos }}
                                </option>
                            {% endfor %}

                        </select>
                    </div>

                    <!-- TIPO -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo de Inmueble</label>
                        <select name="id_tipo" class="form-select" required>
                            <option value="">Seleccione tipo</option>
                            <option value="1">Casa</option>
                            <option value="2">Apartamento</option>
                            <option value="3">Local Comercial</option>
                            <option value="4">Oficina</option>
                        </select>
                    </div>

                    <!-- DIRECCION -->
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" name="direccion" class="form-control"
                               placeholder="Ej: Calle 10 #12-30" required>
                    </div>

                    <!-- AREA -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Área (m²)</label>
                        <input type="number" name="area" class="form-control"
                               min="1" step="0.01" required>
                    </div>

                    <!-- HABITACIONES -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Habitaciones</label>
                        <input type="number" name="habitaciones" class="form-control"
                               min="0" required>
                    </div>

                    <!-- CANON -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Canon mensual</label>
                        <input type="number" name="canon" class="form-control"
                               min="0" required>
                    </div>

                </div>

                <hr>

                <!-- BOTONES -->
                <div class="row">

                    <div class="col-md-6">
                        <button type="submit" class="btn btn-success btn-action">
                            💾 Guardar Inmueble
                        </button>
                    </div>

                    <div class="col-md-6">
                        <a href="/inmuebles" class="btn btn-secondary btn-action">
                            ⬅ Cancelar
                        </a>
                    </div>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
