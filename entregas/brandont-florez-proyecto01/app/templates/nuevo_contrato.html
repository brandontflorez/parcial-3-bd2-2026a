<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Nuevo Contrato</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

{% include "navbar.html" %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>
                📝 Registrar Contrato
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Inmueble</label>

                    <select
                        name="id_inmueble"
                        class="form-control"
                        required>

                        {% for i in inmuebles %}

                        <option value="{{ i.id_inmueble }}">
                            {{ i.direccion }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>Arrendatario</label>

                    <select
                        name="id_arrendatario"
                        class="form-control"
                        required>

                        {% for a in arrendatarios %}

                        <option value="{{ a.id_arrendatario }}">
                            {{ a.nombres }}
                            {{ a.apellidos }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label>Fecha Inicio</label>

                    <input
                        type="date"
                        name="fecha_inicio"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Fecha Fin</label>

                    <input
                        type="date"
                        name="fecha_fin"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Canon Mensual</label>

                    <input
                        type="number"
                        name="canon_mensual"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Depósito</label>

                    <input
                        type="number"
                        name="deposito"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Día de Pago</label>

                    <input
                        type="number"
                        name="dia_pago"
                        class="form-control">

                </div>

                <button
                    class="btn btn-success">

                    Guardar Contrato

                </button>

                <a href="/contratos"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
