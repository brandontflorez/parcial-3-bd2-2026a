<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Propietario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

{% include "navbar.html" %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>
                👤 Registrar Propietario
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Nombres</label>

                    <input
                        type="text"
                        name="nombres"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Apellidos</label>

                    <input
                        type="text"
                        name="apellidos"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Documento</label>

                    <input
                        type="text"
                        name="documento"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Teléfono</label>

                    <input
                        type="text"
                        name="telefono"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Correo</label>

                    <input
                        type="email"
                        name="correo"
                        class="form-control">

                </div>

                <button
                    class="btn btn-success">

                    Guardar

                </button>

                <a href="/propietarios"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
