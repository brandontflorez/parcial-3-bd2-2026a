<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Propietario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

{% include "navbar.html" %}

<body>

<div class="container mt-5">

    <h2 class="mb-4">✏️ Editar propietario</h2>

    <form method="POST">

        <input type="text" name="nombres" class="form-control mb-2"
               value="{{ propietario.nombres }}" required>

        <input type="text" name="apellidos" class="form-control mb-2"
               value="{{ propietario.apellidos }}" required>

        <input type="text" name="documento" class="form-control mb-2"
               value="{{ propietario.documento }}" required>

        <input type="text" name="telefono" class="form-control mb-2"
               value="{{ propietario.telefono }}" required>

        <input type="email" name="correo" class="form-control mb-3"
               value="{{ propietario.correo }}" required>

        <button class="btn btn-success">
            Guardar cambios
        </button>

        <a href="/propietarios" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
