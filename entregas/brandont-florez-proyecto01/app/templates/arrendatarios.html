<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Arrendatarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

{% include "navbar.html" %}

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>🧑 Arrendatarios</h1>

        <a href="/nuevo_arrendatario"
           class="btn btn-success">

            ➕ Nuevo Arrendatario

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                    </tr>

                </thead>

                <tbody>

                {% for a in arrendatarios %}

                    <tr>

                        <td>{{ a.id_arrendatario }}</td>

                        <td>
                            {{ a.nombres }} {{ a.apellidos }}
                        </td>

                        <td>{{ a.documento }}</td>

                        <td>{{ a.telefono }}</td>

                        <td>{{ a.correo }}</td>

                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/dashboard"
           class="btn btn-primary">

            ⬅ Volver

        </a>

    </div>

</div>

</body>
</html>
