<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Propietarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
        }
    </style>
</head>

{% include "navbar.html" %}

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>👤 Propietarios</h2>

        <a href="/nuevo_propietario" class="btn btn-success">
            ➕ Nuevo propietario
        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                {% for p in propietarios %}

                    <tr>
                        <td>{{ p.id_propietario }}</td>
                        <td>{{ p.nombres }} {{ p.apellidos }}</td>
                        <td>{{ p.documento }}</td>
                        <td>{{ p.telefono }}</td>
                        <td>{{ p.correo }}</td>

                        <td>

                            <a href="/editar_propietario/{{ p.id_propietario }}"
                               class="btn btn-warning btn-sm">
                                ✏️ Editar
                            </a>

                            <a href="/eliminar_propietario/{{ p.id_propietario }}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Seguro que quieres eliminar este propietario?')">
                                🗑️ Eliminar
                            </a>

                        </td>
                    </tr>

                {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

    <div class="text-center mt-4">
        <a href="/dashboard" class="btn btn-primary">
            ⬅ Volver
        </a>
    </div>

</div>

</body>
</html>
